<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1759a8" />
    <meta
      name="description"
      content="Mix and match Ranma's original outfits, hairstyles, and accessories."
    />
    <title>Ranma 1/2 Dress-up</title>
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="favicon.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" sizes="180x180" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="src/styles/main.css" />
    <script type="module" src="src/main.ts"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="Ranma 1/2 Dress-up home">
          <img class="brand-mark" src="favicon.svg" alt="" />
          <h1 class="brand-copy">
            <span class="brand-kicker">RANMA 1/2</span>
            <span class="brand-name">Dress-up</span>
          </h1>
        </a>
        <div id="status-view" class="vue-control-host"></div>
        <p id="vue-store-summary" class="vue-store-summary"></p>
        <p id="offline-status" class="offline-status" role="status" aria-live="polite" hidden></p>
        <div class="action-buttons">
          <div id="reset-view" class="vue-control-host"></div>
          <button id="download-look" class="button button-primary" type="button">
            <svg class="button-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
              <circle cx="16" cy="16" r="14" fill="currentColor" />
              <path
                d="M16 7v12m-4-4 4 4 4-4 M9 23h14"
                fill="none"
                stroke="var(--button-surface)"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Save look
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="preview-panel" aria-label="Outfit preview">
          <div class="stage-frame">
            <canvas
              id="outfit-preview"
              width="1196"
              height="1171"
              role="img"
              aria-label="Preview of the selected Ranma outfit"
            >
              Your browser does not support the outfit preview.
            </canvas>
          </div>
        </section>

        <div id="wardrobe-view" class="vue-control-host"></div>
      </main>
    </div>
  </body>
</html>
