<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f1e8">
    <meta name="description" content="Mix and match Ranma's original outfits, hairstyles, and accessories.">
    <title>Ranma 1/2 Dress-up</title>
    <link rel="stylesheet" href="styles.css">
    <script src="sprite-catalog.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="Ranma 1/2 Dress-up home">
          <span class="brand-mark" aria-hidden="true">R</span>
          <h1 class="brand-copy">
            <span class="brand-kicker">RANMA 1/2</span>
            <span class="brand-name">Dress-up</span>
          </h1>
        </a>
      </header>

      <main class="workspace">
        <section class="preview-panel" aria-label="Outfit preview">
          <div class="stage-frame">
            <canvas
              id="outfit-preview"
              width="960"
              height="1080"
              role="img"
              aria-label="Preview of the selected Ranma outfit"
            >
              Your browser does not support the outfit preview.
            </canvas>
          </div>

          <div class="preview-footer">
            <p id="status-message" class="status-message" role="status" aria-live="polite">Loading the wardrobe...</p>
            <div class="action-buttons">
              <button
                id="wardrobe-toggle"
                class="button button-secondary wardrobe-trigger"
                type="button"
                aria-controls="wardrobe-panel"
                aria-expanded="false"
                aria-haspopup="dialog"
              >
                Wardrobe
              </button>
              <button id="reset-look" class="button button-secondary" type="button">
                Reset
              </button>
              <button id="download-look" class="button button-primary" type="button">
                Save look
              </button>
            </div>
          </div>
        </section>

        <button
          id="wardrobe-backdrop"
          class="wardrobe-backdrop"
          type="button"
          aria-label="Close wardrobe"
          tabindex="-1"
          inert
        ></button>
        <aside id="wardrobe-panel" class="wardrobe-panel" aria-label="Wardrobe">
          <div class="wardrobe-heading">
            <div class="wardrobe-heading-actions">
              <button
                id="wardrobe-close"
                class="wardrobe-close"
                type="button"
                aria-label="Close wardrobe"
              >×</button>
            </div>
          </div>

          <nav id="category-tabs" class="category-tabs" aria-label="Wardrobe categories"></nav>
          <div id="item-list" class="item-grid" aria-label="Items in the selected category"></div>
        </aside>
      </main>
    </div>
  </body>
</html>
